<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Map of Sigil</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-mode="player">
<div id="stage">
  <div id="map"></div>
  <div id="pins"></div>
  <div id="mapctl">
    <select id="mapsel" aria-label="Choose map" hidden></select>
    <div class="zoombtns"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button></div>
  </div>
</div>
<div id="panel">
  <div id="card" class="empty">Tap a pin on the map to read about it.</div>
  <div id="wards" class="wards"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
